name: Nvidia3.6-Build-And-Test

on:
  workflow_dispatch:
  schedule:
    - cron: '40 19 * * *'
  push:
    branches: [ "main", "triton_v3.6.x" ]
  pull_request:
    branches: [ "main", "triton_v3.6.x" ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  # Group by PR number for pull_request events to cancel outdated runs from the same PR.
  # Group by commit SHA for push events to allow parallel runs from different merges.
  # Fall back to run_id for other events (e.g., schedule) to ensure each run is independent.
  group: ${{ github.workflow }}-${{
    github.event_name == 'pull_request' && github.event.pull_request.number ||
    github.event_name == 'push' && github.event.head_commit.id ||
    github.run_id }}
  cancel-in-progress: true

jobs:
  nv36x-unit-test:
    runs-on: nvidia3.6
    if: ${{ github.repository == 'flagos-ai/flagtree' && github.event.pull_request.draft == false }}
    steps:
      - name: Setup environment
        shell: bash
        run: |
          source ~/env.sh
          env | grep -E '^(http_proxy|https_proxy|all_proxy|no_proxy)=' >> $GITHUB_ENV || true

      - name: Smart Checkout
        uses: flagos-ai/FlagTree/.github/actions/smart-checkout@main
        with:
          checkout_version: 'v6'

  auto-rerun:
    needs: nv36x-unit-test
    if: always()
    uses: ./.github/workflows/template-rerun-workflow.yml
    with:
      run_id: ${{ format('{0}', github.run_id) }}
      run_attempt: ${{ format('{0}', github.run_attempt) }}
      max_attempts: "5"
    permissions:
      actions: write
      contents: read
