name: Hcu3.6-Build-And-Test

on:
  schedule:
    - cron: '30 20 * * *'
  push:
    branches: [ "main", "triton_v3.6.x" ]
  pull_request:
    branches: [ "main", "triton_v3.6.x" ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hcu36x-unit-test:
    runs-on: hcu3.6
    if: ${{ github.repository == 'flagos-ai/flagtree' && github.event.pull_request.draft == false }}
    steps:
      - name: Setup environment
        shell: bash
        run: |
          source ~/env.sh
          env | grep -E '^(http_proxy|https_proxy|all_proxy|no_proxy)=' >> $GITHUB_ENV || true

      - name: Smart Checkout
        uses: flagos-ai/FlagTree/.github/actions/smart-checkout@main
        with:
          checkout_version: 'v6'

  auto-rerun:
    needs: hcu36x-unit-test
    if: always()
    uses: ./.github/workflows/template-rerun-workflow.yml
    with:
      run_id: ${{ format('{0}', github.run_id) }}
      run_attempt: ${{ format('{0}', github.run_attempt) }}
      max_attempts: "5"
    permissions:
      actions: write
      contents: read
